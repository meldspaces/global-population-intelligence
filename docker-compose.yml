services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: gpi
      POSTGRES_PASSWORD: gpi
      POSTGRES_DB: gpi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema/postgres_postgis.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata:
